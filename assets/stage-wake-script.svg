<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 486" width="1040" height="486" role="img" aria-label="Stage 0 the scheduled wake, and stage 1 the script">
<rect width="1040" height="486" fill="#04091a"/>
<text x="20" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#e0f2fe" font-weight="700">Stage 0 and stage 1: nobody is awake, and the words are not mine</text>
<rect x="20" y="46" width="491" height="400" rx="8" fill="#0a1526" stroke="#1e3a64"/><rect x="20" y="46" width="491" height="34" rx="8" fill="#0d1c33"/><rect x="20" y="72" width="491" height="8" fill="#0d1c33"/><line x1="20" y1="80" x2="511" y2="80" stroke="#1e3a64"/><circle cx="38" cy="63" r="4.5" fill="#ff5f57"/><circle cx="53" cy="63" r="4.5" fill="#febc2e"/><circle cx="68" cy="63" r="4.5" fill="#28c840"/><text x="94" y="68" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8fb4d8">scheduler</text><text x="42" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#8fb4d8"># stage zero is not a person.</text><text x="42" y="133" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#8fb4d8"># it is a timer.</text><text x="42" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e0f2fe">on schedule  wake a headless agent</text><text x="56" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#38bdf8">under a spend budget</text><text x="56" y="233" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#38bdf8">under a wall-clock timeout</text><text x="56" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#38bdf8">with every guard armed</text><text x="42" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#8fb4d8"># no operator present, so</text><text x="42" y="333" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#8fb4d8"># correction is impossible.</text><text x="42" y="383" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#5ddc9a">not a clean success -&gt; pings loud</text><text x="42" y="408" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e0f2fe">silence is never evidence_</text><text x="42" y="430" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8fb4d8" opacity="0.75">stage 0 / 9 : wake</text>
<rect x="529" y="46" width="491" height="400" rx="8" fill="#0a1526" stroke="#1e3a64"/><rect x="529" y="46" width="491" height="34" rx="8" fill="#0d1c33"/><rect x="529" y="72" width="491" height="8" fill="#0d1c33"/><line x1="529" y1="80" x2="1020" y2="80" stroke="#1e3a64"/><circle cx="547" cy="63" r="4.5" fill="#ff5f57"/><circle cx="562" cy="63" r="4.5" fill="#febc2e"/><circle cx="577" cy="63" r="4.5" fill="#28c840"/><text x="603" y="68" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8fb4d8">brief-script.txt</text><text x="551" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#8fb4d8"># stage 1 stopped writing her words.</text><text x="551" y="133" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#8fb4d8"># it borrows them, verbatim:</text><text x="551" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e0f2fe">HER SPOKEN SCRIPT IS ALREADY</text><text x="551" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e0f2fe">WRITTEN. Use this text VERBATIM:</text><text x="551" y="233" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e0f2fe">do not rewrite, reorder, add,</text><text x="551" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e0f2fe">drop, or improvise.</text><text x="551" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#8fb4d8"># today: 114 words, person-shifted,</text><text x="551" y="333" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#8fb4d8"># 43.4s -&gt; 25.5s, trimmed from the</text><text x="551" y="358" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#8fb4d8"># end only, into the 15-25s slot.</text><text x="551" y="383" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#5ddc9a">re-couple fails -&gt; agent-authored,</text><text x="551" y="408" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e0f2fe">and she says so, out loud_</text><text x="551" y="430" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8fb4d8" opacity="0.75">stage 1 / 9 : script</text>
</svg>