<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 624" width="1040" height="624" role="img" aria-label="Measured render cost in credits against clip length, for the flat tier and the premium tiers">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#081228"/><stop offset="1" stop-color="#04091a"/></linearGradient></defs>
<rect width="1040" height="624" fill="url(#bg)"/>
<text x="36" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24.8" fill="#e0f2fe" font-weight="700">Cost is measured, never interpolated</text>
<text x="36" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.1" fill="#8fb4d8">Three real renders per tier. A balance delta read before and after each one.</text>
