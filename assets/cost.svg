<text x="80" y="423.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.3" fill="#8fb4d8" text-anchor="end">0</text>
<line x1="92" y1="314.55172413793105" x2="996" y2="314.55172413793105" stroke="#1e3a64" stroke-dasharray="2 6" opacity="0.5"/>
<text x="80" y="319.55172413793105" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.3" fill="#8fb4d8" text-anchor="end">20</text>
<line x1="92" y1="211.10344827586206" x2="996" y2="211.10344827586206" stroke="#1e3a64" stroke-dasharray="2 6" opacity="0.5"/>
<text x="80" y="216.10344827586206" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.3" fill="#8fb4d8" text-anchor="end">40</text>
<line x1="92" y1="118.0" x2="996" y2="118.0" stroke="#1e3a64" stroke-dasharray="2 6" opacity="0.5"/>
<text x="80" y="123.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.3" fill="#8fb4d8" text-anchor="end">58</text>
<text x="80" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.3" fill="#8fb4d8" text-anchor="end">credits</text>
<text x="144.33684210526314" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.3" fill="#8fb4d8" text-anchor="middle">11s</text>
<text x="691.4947368421052" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.3" fill="#8fb4d8" text-anchor="middle">126s</text>
<text x="896.0842105263158" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.3" fill="#8fb4d8" text-anchor="middle">169s</text>
<polyline points="144.3,392.1 691.5,195.6 896.1,118.0" fill="none" stroke="#f0b429" stroke-width="2" stroke-dasharray="7 6" opacity="0.75"/>
<circle cx="144.3" cy="392.1" r="7" fill="#f0b429"/>
<text x="144.3" y="376.1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21.1" fill="#f0b429" font-weight="700" text-anchor="middle">5</text>
<circle cx="691.5" cy="195.6" r="7" fill="#f0b429"/>
<text x="691.5" y="179.6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21.1" fill="#f0b429" font-weight="700" text-anchor="middle">43</text>
<circle cx="896.1" cy="118.0" r="7" fill="#f0b429"/>
<text x="896.1" y="102.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21.1" fill="#f0b429" font-weight="700" text-anchor="middle">58</text>
<polyline points="144.3,412.8 691.5,412.8 896.1,412.8" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
<circle cx="144.3" cy="412.8" r="7" fill="#38bdf8"/>
<circle cx="691.5" cy="412.8" r="7" fill="#38bdf8"/>
<circle cx="896.1" cy="412.8" r="7" fill="#38bdf8"/>
<text x="910.1" y="418.8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21.1" fill="#38bdf8" font-weight="700">1</text>
<circle cx="187.15789473684208" cy="134" r="6" fill="#f0b429"/>
<text x="203.15789473684208" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.1" fill="#e0f2fe">premium tiers: scale with length, and not knowably linear</text>
<circle cx="187.15789473684208" cy="160" r="6" fill="#38bdf8"/>
<text x="203.15789473684208" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.1" fill="#e0f2fe">flat tier, the scheduled default: 1 credit at every length measured</text>
<rect x="144.3" y="480" width="547.2" height="46" rx="6" fill="#1a1406" stroke="#f0b429" stroke-dasharray="5 5"/>
<text x="417.9" y="501" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.1" fill="#f0b429" font-weight="700" text-anchor="middle">the router returns null here</text>
<text x="417.9" y="519" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.3" fill="#8fb4d8" text-anchor="middle">no measurement, so no number</text>
<text x="36" y="578" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.1" fill="#e0f2fe">A plausible ceil(sec/11)*5 predicts 60 for the render that actually billed 43. It fails the one point it was fitted to.</text>
<text x="36" y="604" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.1" fill="#8fb4d8">So the gap is left empty. A null makes a caller ask; a confident 5 makes it spend 43.</text>
</svg>