<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="stage 1: the morning script">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="100%" stop-color="#0d2147"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <rect x="90" y="70" width="1020" height="535" rx="14" fill="#0a1630" stroke="#38bdf8" stroke-opacity=".45" stroke-width="1.5"/>
  <circle cx="130" cy="108" r="7" fill="#ef4444" opacity=".8"/>
  <circle cx="156" cy="108" r="7" fill="#f59e0b" opacity=".8"/>
  <circle cx="182" cy="108" r="7" fill="#22c55e" opacity=".8"/>
  <text x="220" y="114" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#60a5fa">brief-script.txt</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#93c5fd">
    <text x="130" y="185" fill="#475569"># written by the scheduled agent, no human awake</text>
    <text x="130" y="240">Good morning. Three things worth your</text>
    <text x="130" y="282">attention today, and one number that</text>
    <text x="130" y="324">moved overnight.</text>
    <text x="130" y="390" fill="#475569"># kept above 250 chars: shorter scripts</text>
    <text x="130" y="424" fill="#475569"># measured ~110 Hz brighter than the</text>
    <text x="130" y="458" fill="#475569"># calibrated voice. padding is quality.</text>
    <text x="130" y="524">First, the build that finished while</text>
    <text x="130" y="566">you slept<tspan fill="#38bdf8">_</tspan></text>
  </g>

  <text x="90" y="650" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#38bdf8">stage 1 / 9 : script</text>
</svg>
