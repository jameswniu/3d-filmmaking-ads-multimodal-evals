<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="stage 1: the morning script">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="100%" stop-color="#0d2147"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <rect x="90" y="70" width="1020" height="535" rx="14" fill="#0a1630" stroke="#38bdf8" stroke-opacity=".45" stroke-width="1.5"/>
  <circle cx="130" cy="108" r="7" fill="#ef4444" opacity=".8"/>
  <circle cx="156" cy="108" r="7" fill="#f59e0b" opacity=".8"/>
  <circle cx="182" cy="108" r="7" fill="#22c55e" opacity=".8"/>
  <text x="220" y="114" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#60a5fa">brief-script.txt</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="23" fill="#93c5fd">
    <text x="130" y="180" fill="#475569"># authored by the script-author agent</text>
    <text x="130" y="232">Every clip of me is on probation.</text>
    <text x="130" y="272">I want to tell you what that means,</text>
    <text x="130" y="312">because the pipeline that renders me</text>
    <text x="130" y="352">does not trust itself, and that is</text>
    <text x="130" y="392">its best feature.</text>
    <text x="130" y="454" fill="#475569"># 350 words, 1929 chars. held above 250:</text>
    <text x="130" y="490" fill="#475569"># shorter scripts measured ~110 Hz</text>
    <text x="130" y="526" fill="#475569"># brighter and less consistent.</text>
    <text x="130" y="578">Start with my voice<tspan fill="#38bdf8">_</tspan></text>
  </g>

  <text x="90" y="650" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#38bdf8">stage 1 / 9 : script</text>
</svg>
