<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 476" width="1040" height="476" role="img" aria-label="Four separations: voice from animation, person from background, flat from depth, one view into 77">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#081228"/><stop offset="1" stop-color="#04091a"/></linearGradient></defs>
<rect width="1040" height="476" fill="url(#bg)"/>
<text x="20" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24.8" fill="#e0f2fe" font-weight="700">Four separations, each independently gated</text>
<text x="20" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">This is not one generative model producing a video. That is what makes any of it controllable, and measurable.</text>
<rect x="20" y="104" width="492" height="168" rx="8" fill="#0c1a30" stroke="#1e3a64"/>
<rect x="20" y="104" width="4" height="168" rx="2" fill="#38bdf8"/>
<circle cx="50" cy="134" r="13" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
<text x="50" y="139" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.9" fill="#38bdf8" font-weight="700" text-anchor="middle">1</text>
<text x="74" y="140" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18.6" fill="#e0f2fe" font-weight="700" letter-spacing="0.5">VOICE  /  ANIMATION</text>
<text x="42" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">Audio is synthesized first and drives</text>
<text x="42" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">the render. A bad read kills characters,</text>
<text x="42" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">never credits, because the transcript</text>
<text x="42" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">diff runs before anything is spent.</text>
<rect x="528" y="104" width="492" height="168" rx="8" fill="#0c1a30" stroke="#1e3a64"/>
<rect x="528" y="104" width="4" height="168" rx="2" fill="#38bdf8"/>
<circle cx="558" cy="134" r="13" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
<text x="558" y="139" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.9" fill="#38bdf8" font-weight="700" text-anchor="middle">2</text>
<text x="582" y="140" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18.6" fill="#e0f2fe" font-weight="700" letter-spacing="0.5">PERSON  /  BACKGROUND</text>
<text x="550" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">A matting pass lifts her off the room.</text>
<text x="550" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">Hair is where this is won or lost, and</text>
<text x="550" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">the fill colour decides her wardrobe:</text>
<text x="550" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">black on black shipped a floating head.</text>
<rect x="20" y="288" width="492" height="168" rx="8" fill="#0c1a30" stroke="#1e3a64"/>
<rect x="20" y="288" width="4" height="168" rx="2" fill="#38bdf8"/>
<circle cx="50" cy="318" r="13" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
<text x="50" y="323" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.9" fill="#38bdf8" font-weight="700" text-anchor="middle">3</text>
<text x="74" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18.6" fill="#e0f2fe" font-weight="700" letter-spacing="0.5">FLAT  /  DEPTH</text>
<text x="42" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">A monocular model infers geometry no</text>
<text x="42" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">camera ever captured, locally, one frame</text>
<text x="42" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">at a time. This is the step where a flat</text>
<text x="42" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">photograph becomes something with range.</text>
<rect x="528" y="288" width="492" height="168" rx="8" fill="#0c1a30" stroke="#1e3a64"/>
<rect x="528" y="288" width="4" height="168" rx="2" fill="#38bdf8"/>
<circle cx="558" cy="318" r="13" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
<text x="558" y="323" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14.9" fill="#38bdf8" font-weight="700" text-anchor="middle">4</text>
<text x="582" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18.6" fill="#e0f2fe" font-weight="700" letter-spacing="0.5">ONE  /  77</text>
<text x="550" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">The warp samples 77 camera positions</text>
<text x="550" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">(7 x 11) across the display's view cone.</text>
<text x="550" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">A flat frame cannot hold parallax;</text>
<text x="550" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8fb4d8">an array of them can.</text>
</svg>