# Runs the repo's own claims against the repo.
#
# The existing pii-scan workflow guards what goes OUT. This one guards what is
# ASSERTED: that the thresholds trace to labelled exemplars, that the labelled
# pixels are actually here, and that nothing announces failure while exiting 0.
#
# It fails the build if a threshold drifts outside its own bracket. That is the
# point. A derivation nobody re-runs decays into a number somebody typed.
name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every probe shells out to ffmpeg/ffprobe. requirements.txt cannot express
      # that, and its absence is why a probe "returns no data" instead of failing.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # A fresh clone must be able to import every probe. This catches an
      # undeclared dependency, which is how Pillow stayed missing from
      # requirements.txt while eight files imported it.
      - name: Import every probe
        run: |
          set -e
          for f in probes/*.py; do
            python -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('p', '$f')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          " || { echo "FAILED TO IMPORT: $f"; exit 1; }
          done
          echo "all probes import"

      - name: Derive thresholds from the labelled exemplars
        run: python3 evals/derive.py

      # The published diagram is output, not a typed artifact. --check fails on
      # a hand edit; --audit fails when a count moves in one surface and not
      # the others, which is how `13 probes` and `77 views` came to exist as
      # four independent strings that merely happened to agree.
      - name: Diagrams match their generator
        run: |
          python3 tools/render_diagrams.py --check
          python3 tools/render_diagrams.py --audit

      - name: Test suite
        run: python3 -m pytest tests/ -v

      # Stage 0 is the scheduler, lock, budget cap and timeout. It has no vendor
      # in it, so unlike the other unshipped stages it can be tested here.
      - name: Wake selftest
        run: bash pipeline/wake.sh selftest

      # The one executable test that predates this workflow. It used to fail on a
      # fresh clone because it asserts on a string only emitted when
      # learned_rules.md exists, and that file was never committed. It is now
      # shipped, so this blocks like everything else.
      - name: Prop gate selftest
        run: bash guards/prop_gate.sh selftest

      # The pipeline half must stay runnable against the committed sample pair.
      # These were unrunnable on any clone until samples/ shipped.
      - name: Pipeline runs on the committed sample
        run: |
          python3 pipeline/quilt.py
          python3 pipeline/wiggle_preview.py
