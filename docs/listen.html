<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voice narration, seekable waveform</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0a1626; color: #c9d6e8; font: 15px/1.5 -apple-system, "Segoe UI", sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  main { width: min(920px, 92vw); }
  h1 { font-size: 15px; font-weight: 600; color: #e8eef7; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; font-size: 13px; color: #7d8fa8; }
  p.sub a { color: #6ab0ff; }
  #wavebox { position: relative; background: #060f1d; border: 1px solid #1c2c44; border-radius: 8px;
             height: 160px; cursor: pointer; touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 8px; }
  #bar { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
  button { background: #12213a; color: #e8eef7; border: 1px solid #2a3d5c; border-radius: 6px;
           font: inherit; padding: 6px 18px; cursor: pointer; }
  button:hover { background: #1a2e4f; }
  #clock { font-variant-numeric: tabular-nums; color: #7d8fa8; font-size: 13px; }
  #state { font-size: 13px; color: #7d8fa8; margin-left: auto; }
</style>
</head>
<body>
<main>
  <h1>The narration, under a wave you can click</h1>
  <p class="sub">169 seconds of the cloned voice, the kept median take. Click or drag anywhere in the wave itself and playback seeks there.
     Raw file: <a href="voice-narration.m4a">voice-narration.m4a</a>. Back to <a href="https://github.com/jameswniu/3d-filmmaking-ads-multimodal-evals">the repo</a>.</p>
  <div id="wavebox"><canvas id="wave"></canvas></div>
  <div id="bar">
    <button id="play">Play</button>
    <span id="clock">0:00 / 0:00</span>
    <span id="state">decoding the wave&hellip;</span>
  </div>
  <audio id="audio" src="voice-narration.m4a" preload="auto"></audio>
</main>
<script>
(() => {
  const audio = document.getElementById('audio');
  const box = document.getElementById('wavebox');
  const canvas = document.getElementById('wave');
  const playBtn = document.getElementById('play');
  const clock = document.getElementById('clock');
  const state = document.getElementById('state');
  const ctx = canvas.getContext('2d');
  let peaks = null;

  const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = box.clientWidth, h = box.clientHeight;
    if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const frac = audio.duration ? audio.currentTime / audio.duration : 0;
    if (peaks) {
      const n = peaks.length, mid = h / 2, barW = w / n;
      for (let i = 0; i < n; i++) {
        ctx.fillStyle = (i / n) <= frac ? '#7cc1ff' : '#3d7ab8';
        const amp = Math.max(peaks[i] * (h * 0.46), 0.75);
        ctx.fillRect(i * barW, mid - amp, Math.max(barW * 0.72, 0.8), amp * 2);
      }
    }
    ctx.fillStyle = '#e8735a';
    ctx.fillRect(frac * w - 1, 0, 2, h);
    clock.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
  }

  async function loadPeaks() {
    try {
      const buf = await (await fetch('voice-narration.m4a')).arrayBuffer();
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const decoded = await ac.decodeAudioData(buf);
      const data = decoded.getChannelData(0), n = 900, step = Math.floor(data.length / n);
      peaks = new Float32Array(n);
      let max = 0;
      for (let i = 0; i < n; i++) {
        let m = 0;
        for (let j = i * step, e = j + step; j < e; j += 20) { const v = Math.abs(data[j]); if (v > m) m = v; }
        peaks[i] = m; if (m > max) max = m;
      }
      if (max > 0) for (let i = 0; i < n; i++) peaks[i] /= max;
      ac.close();
      state.textContent = '';
    } catch (e) { state.textContent = 'wave render failed; the scrub strip still seeks'; }
    draw();
  }

  function seekTo(clientX) {
    const r = box.getBoundingClientRect();
    if (audio.duration) audio.currentTime = Math.min(Math.max((clientX - r.left) / r.width, 0), 0.999) * audio.duration;
    draw();
  }
  let dragging = false;
  box.addEventListener('pointerdown', e => { dragging = true; box.setPointerCapture(e.pointerId); seekTo(e.clientX); });
  box.addEventListener('pointermove', e => { if (dragging) seekTo(e.clientX); });
  box.addEventListener('pointerup', () => { dragging = false; });

  playBtn.addEventListener('click', () => audio.paused ? audio.play() : audio.pause());
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  });
  audio.addEventListener('play', () => { playBtn.textContent = 'Pause'; tick(); });
  audio.addEventListener('pause', () => { playBtn.textContent = 'Play'; draw(); });
  audio.addEventListener('loadedmetadata', draw);
  audio.addEventListener('seeked', draw);
  function tick() { if (!audio.paused) { draw(); requestAnimationFrame(tick); } }
  window.addEventListener('resize', draw);

  loadPeaks();
})();
</script>
</body>
</html>
